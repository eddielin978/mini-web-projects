<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hw 5v5 Battle Layout V1</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <section class="battle-screen">
        <h1>Autobattler 5v5 Battle Layout V2</h1>
        <div class="hero hero1">A</div>
        <div class="hero hero2">B</div>
        <div class="hero hero3">C</div>
        <div class="hero hero4">D</div>
        <div class="hero hero5">E</div>
        <div class="hero hero6">F</div>
        <div class="hero hero7">G</div>
        <div class="hero hero8">H</div>
        <div class="hero hero9">I</div>
        <div class="hero hero10">J</div>
        <section class="card-row">
          <div class="hero-card green">
            <p>A</p>
            <div class="energy-bar"></div>
          </div>
          <div class="hero-card grey">
            <p>B</p>
            <div class="energy-bar"></div>
          </div>
          <div class="hero-card green">
            <p>C</p>
            <div class="energy-bar"></div>
          </div>
          <div class="hero-card green1">
            <p>D</p>
            <div class="energy-bar"></div>
          </div>
          <div class="hero-card grey">
            <p>E</p>
            <div class="energy-bar"></div>
          </div>
        </section>
      </section>
    </div>
  </body>
</html>
