<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Levelling Screen Version 1</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <h1>Hero Levelling Screen Version 1</h1>
      <section class="hero-level-screen">
        <section class="left">
          <section class="sidebar">
            <div class="sidebar-item">Skills</div>
            <div class="sidebar-item">Info</div>
          </section>
          <section class="skills">
            <section class="skill1">
              <section class="skill-icon"></section>
              <section class="main-skill-area">
                <div class="skill-name"></div>
                <div class="skill-level"></div>
                <div class="skill-upgrade-cost-display"></div>
              </section>
              <section class="skill-plus"></section>
            </section>
            <section class="skill2">
              <section class="skill-icon"></section>
              <section class="main-skill-area">
                <div class="skill-name"></div>
                <div class="skill-level"></div>
                <div class="skill-upgrade-cost-display"></div>
              </section>
              <section class="skill-plus"></section>
            </section>
            <section class="skill3">
              <section class="skill-icon"></section>
              <section class="main-skill-area">
                <div class="skill-name"></div>
                <div class="skill-level"></div>
                <div class="skill-upgrade-cost-display"></div>
              </section>
              <section class="skill-plus"></section>
            </section>
            <section class="skill4">
              <section class="skill-icon"></section>
              <section class="main-skill-area">
                <div class="skill-name"></div>
                <div class="skill-level"></div>
                <div class="skill-upgrade-cost-display"></div>
              </section>
              <section class="skill-plus"></section>
            </section>
          </section>
        </section>
        <section class="right">
          <section class="sprite-area">
            <div class="sprite">A</div>
          </section>
          <section class="bottom-right">
            <section class="bottom-right-left">
              <div class="hero-level-area"></div>
              <div class="hero-star-level-area"></div>
            </section>
            <div class="power-stat"></div>
          </section>
        </section>
      </section>
    </div>
  </body>
</html>
