name: Deploy Subfolder Vite App to Pages

on:
  push:
    branches: ["main"] # Triggers on pushes to the main branch
  workflow_dispatch: # Allows manual triggers from the Actions tab

# Set permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"
          # Points the cache to the package-lock inside the subfolder
          cache-dependency-path: "./package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: ./

      - name: Build project
        run: npm run build
        working-directory: ./

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the built dist folder from your subfolder
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
