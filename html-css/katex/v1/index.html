<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katex V1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex/dist/contrib/auto-render.min.js"></script>
    <script defer src="boilerplate.js"></script>
  </head>
  <body>
    <p>\(1+2=3\) is a math equation</p>
    <p>$\frac{a}{b}$ is a fraction</p>
    <p>Here's the quadratic formula in display mode</p>
    <p>$$\frac{-b\pm\sqrt{b^2-4ac}}{2a}$$</p>
    <p>Here's a chemical equation in display mode</p>
    <p>$$CH_4 + 2O_2 \rightarrow CO_2 + 2H_2O$$</p>
  </body>
</html>
