on:
  push:
    branches: ["main"] # Triggers on pushes to the main branch
  workflow_dispatch: # Allows manual triggers from the Actions tab

# Set permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Shared Local Setup
        uses: ./html-css/prism-js/github-actions/v1 # Path to your subfolder action
