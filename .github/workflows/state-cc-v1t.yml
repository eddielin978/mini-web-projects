name: Cookie-clicker V1-typed vite app to Github Pages

on:
  push:
    branches: ["main"]
    paths:
      - "state/cookie-clicker/v1-typed/**"
      - "!state/cookie-clicker/v1-typed/public-dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: "state/cookie-clicker/v1-typed/package-lock.json"

      - name: Install and Build Vite App
        run: |
          npm ci
          npm run build
        working-directory: state/cookie-clicker/v1-typed

      - name: Commit and Push Built Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "automated production build [skip ci]"
          file_pattern: "state/cookie-clicker/v1-typed/public-dist/**"
          add_options: "--force"
          skip_dirty_check: false
          disable_globbing: false
