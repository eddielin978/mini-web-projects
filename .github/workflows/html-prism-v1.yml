name: Deploy Subfolder Vite App to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "html-css/prism-js/github-actions/v1/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: "html-css/prism-js/github-actions/v1/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: html-css/prism-js/github-actions/v1

      - name: Build project
        run: npm run build
        working-directory: html-css/prism-js/github-actions/v1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Fixed: Grabbing the compiled asset folder from inside the subfolder
          path: "html-css/prism-js/github-actions/v1/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
