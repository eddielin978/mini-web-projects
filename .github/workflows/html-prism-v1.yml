name: Deploy Vite Subfolder

on:
  push:
    branches: ["main"]
    paths:
      - "html-css/prism-js/v1/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: "html-css/prism-js/v1/package-lock.json"

      - name: Install and Build Vite App
        run: |
          npm ci
          npm run build
        working-directory: html-css/prism-js/v1

      - name: Deploy Subfolder to gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: html-css/prism-js/v1/dist
          target-folder: html-css/prism-js/v1 # Places bundle inside the target layout path
